[workspace]
resolver = "2"
members = [
    "crates/scribe-cli",
    "crates/scribe-core",
    "crates/scribe-ast",
    "crates/scribe-rst",
    "crates/scribe-myst",
    "crates/scribe-config",
    "crates/scribe-domains",
    "crates/scribe-builders",
    "crates/scribe-theme",
    "crates/scribe-autodoc",
    "crates/scribe-cache",
]

[workspace.package]
version = "2.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The scribe contributors"]
repository = "https://github.com/credo/scribe"
description = "A production-grade Rust reimplementation of the Sphinx documentation engine"

[workspace.dependencies]
# CLI + diagnostics (used in Phase 01)
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# Internal workspace crates (consumed via `.workspace = true`).
scribe-config = { path = "crates/scribe-config" }
scribe-ast = { path = "crates/scribe-ast" }
scribe-rst = { path = "crates/scribe-rst" }
scribe-cache = { path = "crates/scribe-cache" }
scribe-core = { path = "crates/scribe-core" }
scribe-domains = { path = "crates/scribe-domains" }
scribe-myst = { path = "crates/scribe-myst" }
scribe-autodoc = { path = "crates/scribe-autodoc" }

# Parallelism + concurrent registries (reserved for Phases 08-14)
rayon = "1"
dashmap = "6"
parking_lot = "0.12"

# Serialization + configuration (reserved for Phases 02, 08, 25)
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"

# Markdown parsing (Phase 07 MyST integration)
pulldown-cmark = { version = "0.13", default-features = false }
serde_yaml = "0.9"

# EPUB ZIP container (Phase 24). `deflate` keeps the archive small while
# `time` lets us pin deterministic DOS timestamps for reproducible builds.
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
# Lightweight XML parser used by the EPUB structural gate tests.
roxmltree = "0.20"

# Deterministic caching (reserved for Phases 08, 30)
blake3 = "1"
bincode = "1.3"
rkyv = "0.8"

# Shared utilities (reserved for later phases)
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Filesystem watcher for the Phase 28 live-reload dev server (`scribe serve`/`watch`).
notify = "8"
url = "2"
strsim = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = "2"
walkdir = "2"
once_cell = "1"
smallvec = "1"
regex = "1"
chrono = "0.4"
similar = "2"
rustc-hash = "2"
unicode-normalization = "0.1"
# Client-side full-text search (Phase 18). `rust-stemmers` is a Rust port of the
# Snowball algorithms used by Sphinx's `snowballstemmer` (`regex`, already listed
# above, strips tags from raw-HTML nodes like the upstream `WordCollector`).
rust-stemmers = "1.2"

# Python source parsing for native autodoc (Phase 21). `rustpython-parser` is a
# pure-Rust Python 3 parser; `rustpython-ast` provides the typed AST nodes.
rustpython-parser = "0.4"
rustpython-ast = "0.4"

# Property-based/adversarial testing (Phase 05 inline parser)
proptest = "1"

# Syntax highlighting (Phase 15). The fancy-regex backend avoids a C compiler
# dependency while still shipping Sublime's default syntax/theme dumps.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

# Templating + theming (Phase 16). `minijinja` is a safe, sandboxed Jinja2
# implementation; `builtins` enables the built-in filters/tests Sphinx themes
# rely on and `loader` provides the filesystem loader trait.
minijinja = { version = "2", features = ["builtins", "loader", "json", "urlencode"] }

# HTML5 writer + standalone HTML builder (Phase 17). These are internal
# workspace crates consumed by `scribe-builders` / `scribe-cli`.
scribe-theme = { path = "crates/scribe-theme" }
scribe-builders = { path = "crates/scribe-builders" }

[workspace.lints.rust]
rust_2018_idioms = "warn"
unused = "warn"

# Phase 30 release-readiness profile. Thin LTO keeps release *test* link times
# tractable while still providing whole-program optimization; `strip` removes
# debug symbols from the shipped binary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
